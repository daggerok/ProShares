# Kept development helper: compares a sampled generated feed with live
# ProShares pages (weights, expense ratios, distribution blocks, blank tenors)
# and commits the report. The shipped updater workflow is update-data.yml.
name: Verify feed against the site

on:
  push:
    paths:
      - 'dev-run/verify-request.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify
        run: |
          set +e
          bun ./dev-run/verify-sources.ts > dev-run/verify-report.txt 2>&1
          echo "verify exit status: $?" | tee -a dev-run/verify-report.txt

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-run/verify-report.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: feed verification report [skip ci]"
          git push
