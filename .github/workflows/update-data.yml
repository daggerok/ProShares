name: Update ProShares ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      tickers:
        description: "Only update these tickers, separated by spaces or commas; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_fetches:
        description: "Batch size; continues after the saved ticker cursor; empty or 0 means a full pass over every catalog fund; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts; keep requests polite to proshares.com and the ProShares data host; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers (keep low; proshares.com sits behind a WAF that answers 403 while throttling); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      category:
        description: "Only funds whose proshares.com asset class contains this text; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or nano/micro/small/mid/large; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      ter:
        description: "Expense ratio range in percent: min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Published 12-Month or indicated dividend-yield percentage range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "Official page SEC 30-Day Yield min:max percentage; an active bound excludes pages without a published value; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows in each generated holdings JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows in each generated history JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "How much official NAV history to publish (max, 20y, 10y, 5y, or a number of months/days such as 36m or 90d); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      distribution_years:
        description: "How many years of the official distribution summary to walk per fund; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries (at least 1) after the initial request (408/425/429/403/5xx); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      store_raw_downloads:
        description: "Store the official rendered holdings/NAV downloads under api/proshares/raw; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      verbose:
        description: "Print per-fund retry and fallback notices (1/true/yes/on); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      offline_seed:
        description: "Replay the previously published catalog and api/proshares/raw samples instead of fetching; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}");
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables: highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/proshares static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add api/proshares
          if git diff --cached --quiet -- api/proshares; then
            echo "api/proshares is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update ProShares ETF data"
          # Runtime-only auth; no token/header stored in URL, file or Git config.
          git -c credential.helper= -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; fi; }; f' push
