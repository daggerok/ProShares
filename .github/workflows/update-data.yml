name: Update ProShares ETF data

on:
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continues after the saved ticker cursor; empty or 0 means a full pass over every catalog fund"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts; keep requests polite to proshares.com, SEC and Yahoo"
        required: false
        default: "2"
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or nano/micro/small/mid/large"
        required: false
        default: ":"
        type: string
      ter:
        description: "Expense ratio range in percent: min:max"
        required: false
        default: ":"
        type: string
      concurrency:
        description: "Parallel fund workers (keep low; proshares.com sits behind a WAF that answers 403 while throttling)"
        required: false
        default: "2"
        type: string
      holdings_page_size:
        description: "Rows in each generated holdings JSON page"
        required: false
        default: "250"
        type: string
      history_page_size:
        description: "Rows in each generated history JSON page"
        required: false
        default: "1000"
        type: string
      store_raw_downloads:
        description: "Store the official rendered holdings/NAV downloads under api/proshares/raw"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (408/425/429/403/5xx)"
        required: false
        default: "3"
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas"
        required: false
        default: ""
        type: string
      category:
        description: "Only funds whose proshares.com asset class contains this text"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Catalog indicated-yield percentage range; colon required"
        required: false
        default: ":"
        type: string
      sec_yield:
        description: "Catalog SEC 30-day yield percentage range; colon required"
        required: false
        default: ":"
        type: string
      history_range:
        description: "Yahoo chart range used for history/distribution rows (max, 10y, 5y, ...)"
        required: false
        default: "max"
        type: string
      edgar_fallback:
        description: "Fall back to SEC EDGAR Form N-PORT-P (ProShares ETF Trust, CIK 0001137360) when a holdings download is unavailable"
        required: false
        default: "1"
        type: string
      skip_yahoo:
        description: "Keep previous history and distributions while refreshing catalog/holdings"
        required: false
        default: ""
        type: string
      skip_proshares:
        description: "Keep the previously published official catalog"
        required: false
        default: ""
        type: string
      sec_ua:
        description: "SEC User-Agent contact string (EDGAR requires a declared identity)"
        required: false
        default: ""
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAX_FETCHES: ${{ inputs.max_fetches || '0' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '2' }}
      AUM: ${{ inputs.aum || ':' }}
      TER: ${{ inputs.ter || ':' }}
      CONCURRENCY: ${{ inputs.concurrency || '2' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '250' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '1000' }}
      STORE_RAW_DOWNLOADS: ${{ inputs.store_raw_downloads || '' }}
      MAX_RETRIES: ${{ inputs.max_retries || '3' }}
      TICKERS: ${{ inputs.tickers || '' }}
      CATEGORY: ${{ inputs.category || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || ':' }}
      SEC_YIELD: ${{ inputs.sec_yield || ':' }}
      HISTORY_RANGE: ${{ inputs.history_range || 'max' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '1' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      SKIP_PROSHARES: ${{ inputs.skip_proshares || '' }}
      SEC_UA: ${{ inputs.sec_ua || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run updater unit tests
        run: bun test scripts/update-data.test.ts

      - name: Generate api/proshares static data
        run: bun ./scripts/update-data.ts

      # Only api/proshares is ever committed: the updater must never rewrite app
      # code, docs or CI config from a data run.
      - name: Commit updated data
        run: |
          if git diff --quiet -- api/proshares; then
            echo "api/proshares is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/proshares
          git commit -m "Update ProShares ETF data"
          git push
